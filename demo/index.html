<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ha-controls demo</title>
    <style>
      :root {
        --primary-color: #03a9f4;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --card-background-color: #fff;
        --divider-color: rgba(0, 0, 0, 0.12);
        --state-light-active-color: #ffb74d;
        --bg: #f2f2f2;
      }
      body.dark {
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --card-background-color: #1c1c1c;
        --divider-color: rgba(255, 255, 255, 0.12);
        --bg: #111;
      }
      body {
        font-family: Roboto, system-ui, sans-serif;
        background: var(--bg);
        color: var(--primary-text-color);
        margin: 0;
        padding: 16px;
      }
      main {
        display: grid;
        gap: 16px;
        max-width: 420px;
        margin: 0 auto;
      }
      h2 { font-size: 14px; font-weight: 500; margin: 8px 0 -8px; color: var(--secondary-text-color); }
      #log { font: 11px monospace; white-space: pre-wrap; color: var(--secondary-text-color); max-height: 160px; overflow: auto; }
    </style>
  </head>
  <body>
    <main>
      <label><input type="checkbox" id="dark" /> Mørkt tema</label>
      <h2>Ét lys</h2>
      <div id="single"></div>
      <h2>Flere lys</h2>
      <div id="group"></div>
      <div id="log"></div>
    </main>

    <script type="module">
      // Tiny stand-ins for the Home Assistant elements the card uses.
      customElements.define('ha-card', class extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: 'open' }).innerHTML =
            '<style>:host{display:block;background:var(--card-background-color);border-radius:12px;border:1px solid var(--divider-color)}</style><slot></slot>';
        }
      });
      const ICONS = {
        'mdi:chevron-down': 'M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z',
        'mdi:close': 'M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z',
        'mdi:creation': 'M12,17.27L18.18,21L16.54,13.64L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.64L5.82,21L12,17.27Z',
        'mdi:palette': 'M17.5,12A1.5,1.5 0 0,1 16,10.5A1.5,1.5 0 0,1 17.5,9A1.5,1.5 0 0,1 19,10.5A1.5,1.5 0 0,1 17.5,12M14.5,8A1.5,1.5 0 0,1 13,6.5A1.5,1.5 0 0,1 14.5,5A1.5,1.5 0 0,1 16,6.5A1.5,1.5 0 0,1 14.5,8M9.5,8A1.5,1.5 0 0,1 8,6.5A1.5,1.5 0 0,1 9.5,5A1.5,1.5 0 0,1 11,6.5A1.5,1.5 0 0,1 9.5,8M6.5,12A1.5,1.5 0 0,1 5,10.5A1.5,1.5 0 0,1 6.5,9A1.5,1.5 0 0,1 8,10.5A1.5,1.5 0 0,1 6.5,12M12,3A9,9 0 0,0 3,12A9,9 0 0,0 12,21A1.5,1.5 0 0,0 13.5,19.5C13.5,19.11 13.35,18.76 13.11,18.5C12.88,18.23 12.73,17.88 12.73,17.5A1.5,1.5 0 0,1 14.23,16H16A5,5 0 0,0 21,11C21,6.58 16.97,3 12,3Z',
      };
      customElements.define('ha-icon', class extends HTMLElement {
        static observedAttributes = ['icon'];
        constructor() {
          super();
          this.attachShadow({ mode: 'open' });
        }
        set icon(v) { this._icon = v; this.render(); }
        get icon() { return this._icon; }
        attributeChangedCallback(_, __, v) { this.icon = v; }
        connectedCallback() { this.render(); }
        render() {
          const d = ICONS[this._icon] ?? 'M12,2A7,7 0 0,0 5,9C5,11.38 6.19,13.47 8,14.74V17A1,1 0 0,0 9,18H15A1,1 0 0,0 16,17V14.74C17.81,13.47 19,11.38 19,9A7,7 0 0,0 12,2M9,21A1,1 0 0,0 10,22H14A1,1 0 0,0 15,21V20H9V21Z';
          this.shadowRoot.innerHTML = `<style>:host{display:inline-flex}svg{width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px)}</style><svg viewBox="0 0 24 24"><path fill="currentColor" d="${d}"/></svg>`;
        }
      });

      await import('../dist/ha-controls.js');

      const kelvinToRgb = (k) => {
        const t = k / 100;
        const c = (v) => Math.round(Math.min(255, Math.max(0, v)));
        if (t <= 66) return [255, c(99.47 * Math.log(t) - 161.12), c(t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04)];
        return [c(329.7 * Math.pow(t - 60, -0.1332)), c(288.12 * Math.pow(t - 60, -0.0755)), 255];
      };
      const hsToRgb = (h, s) => {
        s /= 100;
        const f = (n) => { const k = (n + h / 60) % 6; return Math.round(255 * (1 - s * Math.max(0, Math.min(k, 4 - k, 1)))); };
        return [f(5), f(3), f(1)];
      };

      const light = (id, name, modes, attrs = {}) => ({
        entity_id: id,
        state: attrs.state ?? 'off',
        attributes: {
          friendly_name: name,
          supported_color_modes: modes,
          min_color_temp_kelvin: 2200,
          max_color_temp_kelvin: 6500,
          ...attrs,
        },
      });

      let states = {
        'light.stue': light('light.stue', 'Stue loftlampe', ['color_temp', 'hs'], {
          state: 'on', brightness: 180, color_mode: 'color_temp', color_temp_kelvin: 2700,
          rgb_color: kelvinToRgb(2700), hs_color: [30, 60],
        }),
        'light.sofa': light('light.sofa', 'Sofalampe', ['hs'], {
          state: 'on', brightness: 90, color_mode: 'hs', hs_color: [210, 80], rgb_color: hsToRgb(210, 80),
        }),
        'light.koekken': light('light.koekken', 'Køkken spots', ['color_temp']),
        'light.gang': light('light.gang', 'Gang', ['onoff']),
        'light.kontor': { entity_id: 'light.kontor', state: 'unavailable', attributes: { friendly_name: 'Kontor' } },
      };
      const scene = (id, name, members, icon) => ({
        entity_id: id,
        state: '2026-11-07T20:00:00+00:00',
        attributes: { friendly_name: name, entity_id: members, icon },
      });
      Object.assign(states, {
        'scene.hygge': scene('scene.hygge', 'Hygge', ['light.stue', 'light.sofa'], 'mdi:candle'),
        'scene.film': scene('scene.film', 'Filmaften', ['light.stue', 'light.sofa', 'light.koekken'], 'mdi:movie'),
        'scene.morgen': scene('scene.morgen', 'Godmorgen', ['light.stue', 'light.koekken', 'light.gang']),
        'scene.madlavning': scene('scene.madlavning', 'Madlavning', ['light.koekken']),
        'scene.sovevaerelse': scene('scene.sovevaerelse', 'Soveværelse', ['light.sovevaerelse']),
      });

      const log = (msg) => { const el = document.getElementById('log'); el.textContent = msg + '\n' + el.textContent; };
      window.serviceCalls = [];

      const cards = [];
      const makeHass = () => ({ states, locale: { language: 'da' }, callService });
      async function callService(domain, service, data) {
        window.serviceCalls.push({ domain, service, data });
        log(`${domain}.${service} ${JSON.stringify(data)}`);
        await new Promise((r) => setTimeout(r, 150));
        const ids = [].concat(data.entity_id);
        states = { ...states };
        if (domain === 'scene') {
          for (const id of ids) states[id] = { ...states[id], state: new Date().toISOString() };
          cards.forEach((c) => (c.hass = makeHass()));
          return;
        }
        for (const id of ids) {
          const s = states[id];
          const a = { ...s.attributes };
          let st = s.state;
          if (service === 'turn_off') { st = 'off'; a.brightness = null; }
          if (service === 'turn_on') {
            st = 'on';
            if (data.brightness_pct !== undefined) a.brightness = Math.round(data.brightness_pct * 2.55);
            else if (a.brightness == null && a.supported_color_modes.some((m) => m !== 'onoff')) a.brightness = 255;
            if (data.color_temp_kelvin) {
              Object.assign(a, { color_mode: 'color_temp', color_temp_kelvin: data.color_temp_kelvin, rgb_color: kelvinToRgb(data.color_temp_kelvin) });
            }
            if (data.hs_color) {
              Object.assign(a, { color_mode: 'hs', hs_color: data.hs_color, rgb_color: hsToRgb(...data.hs_color) });
            }
            if (!a.rgb_color && a.color_temp_kelvin) a.rgb_color = kelvinToRgb(a.color_temp_kelvin);
          }
          states[id] = { ...s, state: st, attributes: a };
        }
        const hass = makeHass();
        cards.forEach((c) => (c.hass = hass));
      }

      function addCard(target, config) {
        const card = document.createElement('ha-controls-light-slider-card');
        card.setConfig({ type: 'custom:ha-controls-light-slider-card', ...config });
        card.hass = makeHass();
        document.getElementById(target).appendChild(card);
        cards.push(card);
        return card;
      }

      addCard('single', { entity: 'light.stue' });
      addCard('group', {
        name: 'Stue',
        icon: 'mdi:sofa',
        entities: ['light.stue', { entity: 'light.sofa', name: 'Sofa' }, 'light.koekken', 'light.gang', 'light.kontor'],
        expanded: true,
      });

      document.getElementById('dark').addEventListener('change', (e) =>
        document.body.classList.toggle('dark', e.target.checked));
      window.demoReady = true;
    </script>
  </body>
</html>
